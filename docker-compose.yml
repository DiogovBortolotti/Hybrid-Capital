version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: postgres_hybrid
    restart: always
    environment:
      POSTGRES_DB: hybrid
      POSTGRES_USER: hybrid_user
      POSTGRES_PASSWORD: hybrid_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    container_name: backend_hybrid
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://hybrid_user:hybrid_pass@db:5432/hybrid
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: frontend_hybrid
    restart: always
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
    ports:
      - "8080:8080"

volumes:
  postgres_data:
