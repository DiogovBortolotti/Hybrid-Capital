version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: postgres_hybrid
    restart: always
    environment:
      POSTGRES_DB: hybrid
      POSTGRES_USER: hybrid_user
      POSTGRES_PASSWORD: hybrid_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - hybrid_net

  backend:
    build: ./backend
    container_name: backend_hybrid
    restart: always
    depends_on:
      - db
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    networks:
      - hybrid_net

  frontend:
    build: ./frontend
    container_name: frontend_hybrid
    restart: always
    depends_on:
      - backend
    env_file:
      - ./frontend/.env
    ports:
      - "8080:8080"
    networks:
      - hybrid_net

volumes:
  postgres_data:

networks:
  hybrid_net:
    driver: bridge
